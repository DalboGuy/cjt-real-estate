<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CJT Communications</title><style>
:root{--ink:#14343a;--deep:#0d2b31;--cream:#f7f1e7;--paper:#fffdf9;--muted:#6b7d80;--line:#dfe6e4;--blue:#eaf2ff;--green:#edf7f1}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Inter,system-ui,sans-serif;color:var(--ink)}.wrap{width:min(1260px,calc(100% - 28px));margin:28px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.topActions,.filters,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:10px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.primary{background:var(--deep);color:#fff}.ghost{background:#eef2f1;color:var(--ink)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 32px rgba(13,43,49,.06)}.login{max-width:420px;margin:90px auto;padding:20px}.hidden{display:none}.meta{color:var(--muted);font-size:.88rem}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.stat{padding:15px}.stat b{font-size:1.35rem;display:block}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer;font-weight:700}.filter.active{background:var(--deep);color:#fff}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;margin:12px 0}.hub{display:grid;grid-template-columns:390px 1fr;min-height:620px;overflow:hidden}.list{border-right:1px solid var(--line);max-height:72vh;overflow:auto}.item{padding:16px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff}.item:hover,.item.active{background:#f7faf9}.item.unread{border-left:4px solid var(--deep);padding-left:12px}.row{display:flex;justify-content:space-between;gap:10px}.platform{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:900}.airbnb{color:#b82f43}.vrbo{color:#23538f}.booking{color:#164c74}.houfy{color:#5d5d5d}.snippet{color:var(--muted);font-size:.88rem;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.detail{padding:24px;overflow:auto;max-height:72vh}.detail h2{margin:.2rem 0}.messageBody{white-space:pre-wrap;line-height:1.55;background:#fafbf9;border:1px solid var(--line);padding:18px;border-radius:14px;margin:18px 0}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2f1;font-size:.75rem;margin-right:5px}.empty{padding:40px;text-align:center;color:var(--muted)}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit}@media(max-width:850px){.summary{grid-template-columns:repeat(2,1fr)}.hub{grid-template-columns:1fr}.list{border-right:0;max-height:42vh}.detail{max-height:none}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<div id="login" class="card login hidden"><h1>CJT Owner Portal</h1><p class="meta">Sign in to view guest communications.</p><form id="loginForm"><input id="passcode" type="password" placeholder="Owner passcode" required><div style="height:12px"></div><button class="btn primary">Sign in</button></form><p id="loginMsg" class="meta"></p></div>
<div id="app" class="hidden"><div class="top"><div><h1 style="margin:0">Communications Hub</h1><div class="meta">Airbnb, Vrbo, Booking.com, Houfy and direct guest traffic</div></div><div class="topActions"><a class="btn ghost" href="/owner">Booking Dashboard</a><button id="logout" class="btn ghost">Sign out</button></div></div>
<div id="summary" class="summary"></div><div class="filters" id="filters"></div><input id="search" class="search" placeholder="Search guest, subject, reservation or message…">
<div class="card hub"><div id="list" class="list"></div><div id="detail" class="detail"><div class="empty">Select a conversation.</div></div></div></div>
</div><script>
let messages=[],currentFilter='all',selected=null;
const login=document.getElementById('login'),app=document.getElementById('app'),list=document.getElementById('list'),detail=document.getElementById('detail');
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(v){return v?new Date(v).toLocaleString():''}
async function ownerLogin(passcode){const r=await fetch('/api/owner',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',passcode})});if(!r.ok)throw new Error('Invalid passcode')}
async function api(opts={}){const r=await fetch('/api/communications',{headers:{'Content-Type':'application/json'},...opts});const d=await r.json().catch(()=>({}));if(r.status===401)throw new Error('unauthorized');if(!r.ok)throw new Error(d.error||'request_failed');return d}
async function load(){try{const d=await api();messages=d.messages||[];login.classList.add('hidden');app.classList.remove('hidden');renderSummary(d.counts||[]);renderFilters();renderList()}catch(e){if(e.message==='unauthorized'){app.classList.add('hidden');login.classList.remove('hidden')}else{detail.innerHTML='<div class="empty">Could not load communications.</div>'}}}
function renderSummary(counts){const map=Object.fromEntries(counts.map(x=>[x.platform,x]));const total=counts.reduce((a,x)=>a+x.total,0),unread=counts.reduce((a,x)=>a+x.unread,0);const cards=[['All',total,unread],['Airbnb',map.airbnb?.total||0,map.airbnb?.unread||0],['Vrbo',map.vrbo?.total||0,map.vrbo?.unread||0],['Booking.com',map.booking?.total||0,map.booking?.unread||0],['Houfy',map.houfy?.total||0,map.houfy?.unread||0]];document.getElementById('summary').innerHTML=cards.map(c=>`<div class="card stat"><span class="meta">${c[0]}</span><b>${c[1]}</b><span class="meta">${c[2]} unread</span></div>`).join('')}
function renderFilters(){const vals=[['all','All'],['airbnb','Airbnb'],['vrbo','Vrbo'],['booking','Booking.com'],['houfy','Houfy'],['open','Open'],['archived','Archived']];document.getElementById('filters').innerHTML=vals.map(([v,l])=>`<button class="filter ${currentFilter===v?'active':''}" data-f="${v}">${l}</button>`).join('');document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{currentFilter=b.dataset.f;renderFilters();renderList()})}
function filtered(){const q=document.getElementById('search').value.trim().toLowerCase();return messages.filter(m=>{const ok=currentFilter==='all'||(currentFilter==='open'&&m.status==='open')||(currentFilter==='archived'&&m.status==='archived')||m.platform===currentFilter;if(!ok)return false;if(!q)return true;return [m.guest_name,m.subject,m.snippet,m.body,m.reservation_ref].join(' ').toLowerCase().includes(q)})}
function renderList(){const rows=filtered();list.innerHTML=rows.length?'':'<div class="empty">No matching messages.</div>';for(const m of rows){const d=document.createElement('div');d.className=`item ${m.is_read?'':'unread'} ${selected===m.id?'active':''}`;d.innerHTML=`<div class="row"><span class="platform ${esc(m.platform)}">${esc(m.platform)}</span><span class="meta">${esc(new Date(m.received_at).toLocaleDateString())}</span></div><strong>${esc(m.guest_name||m.subject)}</strong><div>${esc(m.subject)}</div><div class="snippet">${esc(m.snippet||m.body||'')}</div>`;d.onclick=()=>selectMessage(m);list.appendChild(d)}}
async function selectMessage(m){selected=m.id;if(!m.is_read){m.is_read=true;api({method:'POST',body:JSON.stringify({action:'mark_read',id:m.id})}).catch(()=>{})}renderList();const stay=(m.stay_checkin||m.stay_checkout)?`<span class="badge">Stay ${esc(m.stay_checkin||'?')} → ${esc(m.stay_checkout||'?')}</span>`:'';const ref=m.reservation_ref?`<span class="badge">${esc(m.reservation_ref)}</span>`:'';detail.innerHTML=`<div class="platform ${esc(m.platform)}">${esc(m.platform)}</div><h2>${esc(m.guest_name||'Guest')}</h2><div class="meta">${esc(m.subject)} · ${esc(fmt(m.received_at))}</div><div style="margin-top:10px">${stay}${ref}<span class="badge">${esc(m.message_type)}</span></div><div class="messageBody">${esc(m.body||m.snippet||'No message body available.')}</div><div class="actions">${m.platform_url?`<a class="btn primary" target="_blank" rel="noopener" href="${esc(m.platform_url)}">Open ${esc(m.platform)} thread ↗</a>`:''}${m.gmail_url?`<a class="btn ghost" target="_blank" rel="noopener" href="${esc(m.gmail_url)}">Open Gmail ↗</a>`:''}<button id="toggleRead" class="btn ghost">Mark ${m.is_read?'unread':'read'}</button><button id="toggleArchive" class="btn ghost">${m.status==='archived'?'Reopen':'Archive'}</button></div>`;document.getElementById('toggleRead').onclick=async()=>{const action=m.is_read?'mark_unread':'mark_read';await api({method:'POST',body:JSON.stringify({action,id:m.id})});m.is_read=!m.is_read;selectMessage(m)};document.getElementById('toggleArchive').onclick=async()=>{const action=m.status==='archived'?'reopen':'archive';await api({method:'POST',body:JSON.stringify({action,id:m.id})});m.status=m.status==='archived'?'open':'archived';renderList();selectMessage(m)}}
document.getElementById('search').addEventListener('input',renderList);document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('loginMsg');try{msg.textContent='Signing in…';await ownerLogin(document.getElementById('passcode').value);document.getElementById('passcode').value='';msg.textContent='';await load()}catch(err){msg.textContent=err.message}};document.getElementById('logout').onclick=async()=>{await fetch('/api/owner',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})}).catch(()=>{});location.href='/owner'};load();
</script></body></html>
