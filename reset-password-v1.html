<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CJT Realty · Choose New Password</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/owner-shell.css">
  <link rel="stylesheet" href="/assets/css/modules.css">
</head>
<body>
  <section class="login-shell">
    <div class="login-card" style="width:min(520px,100%)">
      <div class="brand" style="color:var(--cjt-ink)">CJT REALTY<small style="color:var(--cjt-muted)">Password Recovery</small></div>
      <h1>Choose a new password</h1>
      <p>Your new password can be any 5 or more characters.</p>
      <div id="notice" class="notice hidden"></div>
      <form id="resetForm">
        <label class="metric-label" for="password">New password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="5" required placeholder="At least 5 characters">
        <label class="metric-label" for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="5" required placeholder="Repeat password">
        <button class="btn btn-primary" style="width:100%;margin-top:12px" type="submit">Reset password</button>
      </form>
      <p id="message" class="login-msg"></p>
      <div class="widget-footer"><a class="btn btn-secondary" href="/login-v1">Back to sign in</a></div>
    </div>
  </section>
<script>
const params=new URLSearchParams(location.search);const token=params.get('token')||'';
const form=document.getElementById('resetForm');const message=document.getElementById('message');const notice=document.getElementById('notice');
if(!token){form.classList.add('hidden');message.textContent='This reset link is incomplete.';}
function errorText(code){return ({password_too_short:'Use at least 5 characters.',invalid_or_expired_token:'This reset link is invalid or has expired.',recovery_storage_not_available:'Password recovery storage is not active on the current preview database yet.'})[code]||'The password could not be reset.'}
form.addEventListener('submit',async e=>{
  e.preventDefault();const password=document.getElementById('password').value;const confirm=document.getElementById('confirmPassword').value;
  if(password!==confirm){message.textContent='The passwords do not match.';return;}
  message.textContent='Updating password…';
  try{
    const r=await fetch('/api/password-recovery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'reset',token,password})});
    const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'request_failed');
    form.classList.add('hidden');notice.textContent='Password updated. Existing CJT sessions were signed out. You can now sign in with your new password.';notice.classList.remove('hidden');message.textContent='';
  }catch(err){message.textContent=errorText(err.message);}
});
</script>
</body>
</html>
