<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Seasonal Pricing — demo</title><link rel="stylesheet" href="../widget/seasonal-pricing.css"><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#efefed;color:#171717}body{margin:0;min-height:100vh}.demo-shell{max-width:1080px;margin:0 auto;padding:48px 24px 72px}.demo-kicker{margin:0 0 8px;color:#717171;font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}h1{margin:0;max-width:700px;font-size:clamp(2rem,5vw,3.7rem);letter-spacing:-.055em;line-height:1.02}.demo-copy{max-width:650px;margin:15px 0 32px;color:#626262;font-size:1.03rem}.demo-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr);gap:22px;align-items:start}.demo-card{border:1px solid #d8d8d5;border-radius:12px;background:#fff;padding:20px}.demo-card h2{margin:0 0 15px;font-size:1rem}.demo-card p,.demo-card label{color:#666;font-size:.85rem}.demo-card label{display:block;margin-top:16px;color:#333;font-weight:700}.demo-card input,.demo-card select{width:100%;margin-top:7px;padding:9px;border:1px solid #cfcfcb;border-radius:7px;background:#fff;font:inherit}.demo-card output{display:block;margin-top:12px;font-size:.8rem;color:#666}@media(max-width:760px){.demo-shell{padding:30px 14px 45px}.demo-grid{grid-template-columns:1fr}}
</style></head><body><main class="demo-shell"><p class="demo-kicker">CJT Realty · handoff preview</p><h1>A clearer view of seasonal rates.</h1><p class="demo-copy">Standalone preview of the production accordion. Values are intentionally illustrative and are not connected to live pricing.</p><div class="demo-grid"><section id="cjt-seasonal-pricing" aria-label="Seasonal Pricing"></section><aside class="demo-card" aria-labelledby="motion-title"><h2 id="motion-title">Motion tuning panel</h2><p>Demo-only controls. These knobs are not part of the customer widget API.</p><label for="duration">Duration <output id="duration-output">220ms</output></label><input id="duration" type="range" min="0" max="600" value="220" step="10"><label for="easing">Easing</label><select id="easing"><option value="cubic-bezier(.22,1,.36,1)">Spring-like</option><option value="ease">Ease</option><option value="linear">Linear</option></select><label for="stagger">Stagger <output id="stagger-output">0ms</output></label><input id="stagger" type="range" min="0" max="180" value="0" step="10"></aside></div></main>
<script src="../widget/sample-data.js"></script><script src="../widget/seasonal-pricing.js"></script><script>(function(){var root=document.getElementById('cjt-seasonal-pricing'),s=window.CJTSeasonalPricingSample;window.CJTSeasonalPricing.mount(root,{baseRate:s.baseRate,seasons:s.seasons,sampleData:true});var d=document.getElementById('duration'),e=document.getElementById('easing'),g=document.getElementById('stagger');function update(){root.style.setProperty('--cjt-seasonal-duration',d.value+'ms');root.style.setProperty('--cjt-seasonal-easing',e.value);root.style.setProperty('--cjt-seasonal-stagger',g.value+'ms');document.getElementById('duration-output').textContent=d.value+'ms';document.getElementById('stagger-output').textContent=g.value+'ms'}d.addEventListener('input',update);e.addEventListener('input',update);g.addEventListener('input',update);update()}());</script></body></html>
