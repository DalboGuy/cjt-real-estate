<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CJT Messages | Owner Portal</title>
<style>
:root{--deep:#0d2b31;--ink:#14343a;--muted:#6b7d80;--paper:#fffdf9;--cream:#f7f1e7;--line:#dfe6e4;--soft:#eef2f1;--warn:#fff3cf}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.top{background:var(--deep);color:#fff;padding:16px 20px}.topin{width:min(1240px,100%);margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center}.top a{color:#fff;text-decoration:none;font-weight:850}.wrap{width:min(1240px,calc(100% - 24px));margin:20px auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.head h1{font-family:Georgia,serif;font-weight:500;margin:0;font-size:clamp(2rem,4vw,3.2rem)}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:14px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 32px rgba(13,43,49,.06);overflow:hidden}.threadlist{max-height:72vh;overflow:auto}.thread{padding:14px;border-bottom:1px solid var(--line);cursor:pointer}.thread:hover,.thread.active{background:#f6faf8}.thread:last-child{border-bottom:0}.threadtop{display:flex;justify-content:space-between;gap:10px}.threadname{font-weight:900}.unread{background:var(--deep);color:#fff;border-radius:999px;min-width:22px;height:22px;padding:0 7px;display:inline-grid;place-items:center;font-size:.7rem;font-weight:900}.preview{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.meta{color:var(--muted);font-size:.74rem;margin-top:4px}.chat{display:grid;grid-template-rows:auto minmax(300px,1fr) auto;height:72vh}.chathead{padding:16px 18px;border-bottom:1px solid var(--line)}.chathead h2{margin:0;font-size:1.1rem}.messages{padding:16px;overflow:auto;display:grid;align-content:start;gap:10px;background:#fbfcfb}.msg{max-width:76%;padding:11px 13px;border-radius:15px;background:#eef2f1;justify-self:start}.msg.owner{justify-self:end;background:var(--deep);color:#fff}.msg .who{font-size:.68rem;font-weight:900;opacity:.72;margin-bottom:4px}.msg .body{white-space:pre-wrap;overflow-wrap:anywhere}.msg .when{font-size:.65rem;opacity:.6;margin-top:5px}.empty{padding:28px;text-align:center;color:var(--muted)}.reply{display:grid;grid-template-columns:1fr auto;gap:9px;padding:14px;border-top:1px solid var(--line)}textarea{min-height:50px;max-height:130px;resize:vertical;border:1px solid var(--line);border-radius:13px;padding:11px;font:inherit}.btn{border:0;border-radius:999px;padding:11px 16px;font-weight:850;cursor:pointer;background:var(--deep);color:#fff}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);text-decoration:none}.btn:disabled{opacity:.5}.notice{padding:14px;border-radius:14px;background:var(--warn);margin-top:12px}@media(max-width:860px){.layout{grid-template-columns:1fr}.threadlist{max-height:34vh}.chat{height:58vh}.reply{grid-template-columns:1fr}.msg{max-width:90%}}
</style></head>
<body><div class="top"><div class="topin"><a href="/owner">← Owner Portal</a><strong>Sand & Sea Manor</strong></div></div><main class="wrap"><div class="head"><div><h1>Guest Messages</h1><div class="muted">Reservation-linked conversations from the direct-booking customer experience.</div></div><button id="refresh" class="btn ghost">Refresh</button></div><div id="notice"></div><div class="layout"><section class="panel"><div id="threadList" class="threadlist"><div class="empty">Loading conversations…</div></div></section><section class="panel chat"><div id="chatHead" class="chathead"><h2>Select a conversation</h2><div class="meta">Guest messages will appear here.</div></div><div id="messages" class="messages"><div class="empty">No conversation selected.</div></div><form id="replyForm" class="reply"><textarea id="replyBody" maxlength="4000" placeholder="Reply to guest…" disabled required></textarea><button id="send" class="btn" disabled>Send</button></form></section></div></main>
<script>
const list=document.getElementById('threadList'),msgs=document.getElementById('messages'),head=document.getElementById('chatHead'),form=document.getElementById('replyForm'),body=document.getElementById('replyBody'),send=document.getElementById('send'),notice=document.getElementById('notice');let threads=[],selected=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>s?new Date(s).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';const date=s=>s?new Date(s+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';
function authFail(){notice.innerHTML='<div class="notice">Owner sign-in required. <a href="/owner">Open the Owner Portal</a>, sign in, then return to Messages.</div>';list.innerHTML='<div class="empty">Not signed in.</div>'}
function renderThreads(){if(!threads.length){list.innerHTML='<div class="empty">No guest conversations yet.</div>';return}list.innerHTML=threads.map(t=>`<div class="thread ${selected===t.id?'active':''}" data-id="${esc(t.id)}"><div class="threadtop"><span class="threadname">${esc(t.guest_name||t.guest_email||t.id)}</span>${Number(t.unread_count)>0?`<span class="unread">${Number(t.unread_count)}</span>`:''}</div><div class="preview">${esc(t.last_sender==='owner'?'You: ':'')}${esc(t.last_message||'')}</div><div class="meta">${date(t.checkin)}–${date(t.checkout)} · ${esc(t.status)} · ${fmt(t.last_message_at)}</div></div>`).join('');list.querySelectorAll('.thread').forEach(el=>el.onclick=()=>openThread(el.dataset.id))}
async function loadThreads(){try{const r=await fetch('/api/chat?mode=owner_threads',{cache:'no-store'}),d=await r.json();if(r.status===401||r.status===428){authFail();return}if(!r.ok)throw new Error(d.error||'Unable to load messages');notice.innerHTML='';threads=d.threads||[];renderThreads();if(selected&&!threads.some(t=>t.id===selected)){selected=null;head.innerHTML='<h2>Select a conversation</h2><div class="meta">Guest messages will appear here.</div>';msgs.innerHTML='<div class="empty">No conversation selected.</div>';body.disabled=true;send.disabled=true}}catch(e){notice.innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
async function openThread(id){selected=id;renderThreads();body.disabled=true;send.disabled=true;msgs.innerHTML='<div class="empty">Loading conversation…</div>';try{const r=await fetch('/api/chat?mode=owner_thread&reservation_id='+encodeURIComponent(id),{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load conversation');const x=d.reservation;head.innerHTML=`<h2>${esc(x.guest_name||x.guest_email||x.id)}</h2><div class="meta">${esc(x.id)} · ${date(x.checkin)}–${date(x.checkout)} · ${esc(x.status)}</div>`;const m=d.messages||[];msgs.innerHTML=m.length?m.map(v=>`<div class="msg ${v.sender_type==='owner'?'owner':''}"><div class="who">${v.sender_type==='owner'?esc(v.sender_name||'CJT'):'Guest'}</div><div class="body">${esc(v.body)}</div><div class="when">${fmt(v.created_at)}</div></div>`).join(''):'<div class="empty">No messages in this conversation yet.</div>';msgs.scrollTop=msgs.scrollHeight;body.disabled=false;send.disabled=false;body.focus();await loadThreads()}catch(e){msgs.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
form.addEventListener('submit',async e=>{e.preventDefault();if(!selected)return;const text=body.value.trim();if(!text)return;send.disabled=true;send.textContent='Sending…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'owner_send',reservation_id:selected,body:text})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not send reply');body.value='';await openThread(selected)}catch(e){alert(e.message)}finally{send.disabled=false;send.textContent='Send'}});document.getElementById('refresh').onclick=()=>loadThreads();loadThreads();setInterval(()=>{if(!document.hidden){loadThreads();if(selected)openThread(selected)}},20000);
</script></body></html>
