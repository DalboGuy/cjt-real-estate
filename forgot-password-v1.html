<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CJT Realty · Reset Password</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/owner-shell.css">
  <link rel="stylesheet" href="/assets/css/modules.css">
</head>
<body>
  <section class="login-shell">
    <div class="login-card" style="width:min(520px,100%)">
      <div class="brand" style="color:var(--cjt-ink)">CJT REALTY<small style="color:var(--cjt-muted)">Password Recovery</small></div>
      <h1>Reset your password</h1>
      <p>Enter the email on your CJT account. Reset links expire after 30 minutes.</p>
      <div id="notice" class="notice hidden"></div>
      <form id="recoveryForm">
        <label class="metric-label" for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
        <button class="btn btn-primary" style="width:100%;margin-top:12px" type="submit">Send reset link</button>
      </form>
      <p id="message" class="login-msg"></p>
      <div class="widget-footer"><a class="btn btn-secondary" href="/login-v1">Back to sign in</a></div>
    </div>
  </section>
<script>
const form=document.getElementById('recoveryForm');
const message=document.getElementById('message');
const notice=document.getElementById('notice');
function errorText(code){return ({
  valid_email_required:'Enter a valid email address.',
  recovery_storage_not_available:'Password recovery storage is not active on the current preview database yet.',
  recovery_delivery_not_configured:'Password recovery is built, but automated email delivery is not connected yet.',
  delivery_not_configured:'Password recovery is built, but automated email delivery is not connected yet.',
  delivery_failed:'The reset email could not be sent. Try again later.'
})[code]||'The reset request could not be completed.'}
form.addEventListener('submit',async e=>{
  e.preventDefault();message.textContent='Sending reset instructions…';notice.classList.add('hidden');
  try{
    const r=await fetch('/api/password-recovery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'request',email:document.getElementById('email').value})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||'request_failed');
    form.classList.add('hidden');notice.textContent='If that email belongs to an active CJT account, reset instructions have been sent.';notice.classList.remove('hidden');message.textContent='';
  }catch(err){message.textContent=errorText(err.message);}
});
</script>
</body>
</html>
