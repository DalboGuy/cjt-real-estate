<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CJT Owner Password Reset</title><style>:root{--ink:#14343a;--deep:#0d2b31;--cream:#f7f1e7;--line:#dfe6e4;--muted:#6b7d80}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Inter,system-ui,sans-serif;color:var(--ink)}.card{max-width:480px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 32px rgba(13,43,49,.08)}label{display:block;font-size:.8rem;font-weight:800;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit}.btn{margin-top:16px;border:0;border-radius:999px;padding:12px 18px;background:var(--deep);color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.meta{color:var(--muted);font-size:.9rem}.msg{margin-top:14px}.ok{color:#245b3f}.bad{color:#7a2929}a{color:var(--ink)}</style></head><body><div class="card"><h1>Reset Owner Admin Password</h1><p class="meta">Use this only for the primary CJT admin account. You will need the private owner passcode already configured in Vercel.</p><form id="f"><label>Admin email</label><input name="email" type="email" required><label>New password</label><input name="newPassword" type="password" minlength="10" required><label>Current owner passcode</label><input name="ownerPasscode" type="password" required><button id="b" class="btn" type="submit">Reset password</button><div id="m" class="msg"></div></form><p class="meta"><a href="/owner">Back to Owner Portal</a></p></div><script>const f=document.getElementById('f'),b=document.getElementById('b'),m=document.getElementById('m');f.onsubmit=async e=>{e.preventDefault();b.disabled=true;b.textContent='Resetting…';m.textContent='';m.className='msg';try{const r=await fetch('/api/recover-owner',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f).entries()))});const d=await r.json();if(!r.ok)throw new Error(d.error||'reset_failed');m.className='msg ok';m.textContent='Password reset. Redirecting to sign in…';setTimeout(()=>location.href='/owner',1000)}catch(err){m.className='msg bad';m.textContent=err.message==='invalid_passcode'?'Owner passcode did not match.':err.message==='admin_not_found'?'That email is not the active admin account.':'Could not reset the password.';b.disabled=false;b.textContent='Reset password'}};</script></body></html>
